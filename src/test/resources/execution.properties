################ Execution ################
# parallel execution: true / false
execution.parallel=true
# number of parallel threads
execution.threadCount=2
# tags to execute
execution.tags=@Positive
# feature path to execute
execution.features=src/test/resources/features/android

################ Platform ################
# android / ios
platform.name=android

################ Appium ################
# Appium server URL
appium.server.url=http://127.0.0.1:4723

################ Application ################
# app location
app.path=src/test/resources/apps/General-Store.apk
# android package
app.package=com.androidsample.generalstore
# launch activity
app.activity=com.androidsample.generalstore.MainActivity

################ Device ################
# device source: json / adb / cloud
device.source=json

################ Logging ################
# DEBUG / INFO / WARN / ERROR
log.level=INFO

################ Retry ################
# retry failed tests
retry.count=1

################ Reporting ################
# screenshot on failure
screenshot.onFailure=true
# enable video recording
video.recording=false

################ Waits ################
# implicit wait (seconds)
implicitWait=10